<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Database Studio{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"></head><body>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="alerts">{% for kind, message in messages %}<div class="alert {{ kind }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</body></html>
